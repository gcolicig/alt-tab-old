[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-ch"
version = "0.1.0"
description = "Multilingual, locale-aware humanization and proofreading core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
proofread = []
translation = []
dev = ["PyYAML>=6.0"]

[project.scripts]
humanizer-ch = "humanizer_ch_core.cli:main"
proofread-ch = "humanizer_ch_core.cli:proofread_main"
translate-ch = "humanizer_ch_core.cli:translate_main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["humanizer_ch_core*", "scripts"]

[tool.humanizer_ch.verify]
report_schema = "schemas/verification-report.schema.json"
test_directory = "tests"
deterministic = true
network = false
